# Polar FFT (Section 0) — WaveX generative explainer.
# Live FFT λ / bins live HERE (then CLI: --lam-act --lam-ce --lam-kl --lam-energy --lam-bin --lam-tv --lam-rob).
# Defaults if this file is missing: config.py DEFAULT_LAMBDAS_FFT.
# Area loss is not used in FFT (polar-bin mean is not spectral energy).
#
# Checkpoint: highest EF1 = HM(1 − p_energy, conf(e))
#   p_energy = ||m ⊙ FFT(x)||² / ||FFT(x)||²

fft_radial_bins: 16
fft_angular_bins: 16
mask_temperature: 0.25
mask_threshold: 0.5
noise_scale: 0.1
n_lpf_radii: 50          # linear r=0…1 samples for LPF vs greedy Δconf plot

lambdas:
  act: 10.0
  ce: 0.0
  kl: 5.0
  energy: 15.0    # L_energy = p_energy
  bin: 1.0
  tv: 0.0
  rob: 5.0        # KL after corrupting dropped Fourier bins with white noise
